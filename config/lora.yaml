# A conservative configuration for an 8 GB Apple-silicon Mac.
model: "mlx-community/Llama-3.2-1B-Instruct-4bit"
train: true
fine_tune_type: lora
data: "data/processed"
seed: 42
num_layers: 4
batch_size: 1
iters: 120
learning_rate: 1.0e-5
steps_per_report: 10
steps_per_eval: 30
val_batches: -1
save_every: 60
adapter_path: "artifacts/adapters"
max_seq_length: 512
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 8
  scale: 16.0
  dropout: 0.05
